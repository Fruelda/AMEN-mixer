name: Build Android APK

# ============================================================
# TRIGGER
# ============================================================

on:
  push:
    branches:
      - feature/android-app

  workflow_dispatch:


# ============================================================
# JOBS
# ============================================================

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest


    # ========================================================
    # DEFAULT PATH
    # ========================================================

    defaults:
      run:
        working-directory: desktop/frontend


    steps:

      # ======================================================
      # CHECKOUT SOURCE
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # NODE JS
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json


      # ======================================================
      # JAVA
      # ======================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle


      # ======================================================
      # FRONTEND DEPENDENCIES
      # ======================================================

      - name: Install frontend dependencies
        run: npm ci


      # ======================================================
      # BUILD VUE
      # ======================================================

      - name: Build frontend
        run: npm run build
        env:
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}


      # ======================================================
      # CAPACITOR SYNC
      # ======================================================

      - name: Sync Capacitor Android
        run: npx cap sync android


      # ======================================================
      # GRADLE PERMISSION
      # ======================================================

      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # ======================================================
      # BUILD APK
      # ======================================================

      - name: Build debug APK
        working-directory: desktop/frontend/android
        run: ./gradlew assembleDebug


      # ======================================================
      # UPLOAD APK
      # ======================================================

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: amen-mixer-debug-${{ github.run_number }}
          path: desktop/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14